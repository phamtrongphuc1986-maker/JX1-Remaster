name: JX1M integration checks

on:
  push:
    branches: [integration/jx1m-clean-monorepo]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/INTEGRATION_AUDIT_VI.md
          test -f docs/SOURCE_AUDIT_2026-11-28_VI.md
          echo "Repository documentation checks passed."

      - name: Validate Cocos Creator assets
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cocos project manifest, imports and maps
        run: node tools/validate-cocos-assets.mjs

      - name: Set up Go from server go.mod
        if: ${{ hashFiles('server/go.mod') != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Test Go server
        if: ${{ hashFiles('server/go.mod') != '' }}
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod download
          go test ./...
          go vet ./...
          go build -trimpath -o /tmp/jx1m-server-ci .

      - name: Smoke test Go API
        if: ${{ hashFiles('server/go.mod') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jx1m-ci-run/data
          (
            cd /tmp/jx1m-ci-run
            /tmp/jx1m-server-ci > /tmp/jx1m-ci-server.log 2>&1 &
            echo $! > /tmp/jx1m-ci-server.pid
          )
          cleanup() {
            if [ -f /tmp/jx1m-ci-server.pid ]; then
              kill "$(cat /tmp/jx1m-ci-server.pid)" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8083/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8083/health
          BASE_URL=http://127.0.0.1:8083 bash "$GITHUB_WORKSPACE/server/scripts/smoke-test.sh"

      - name: Report source not imported yet
        if: ${{ hashFiles('server/go.mod') == '' }}
        run: echo "::notice::Go source has not been imported yet; Go build, tests and API smoke test are not run."
