name: JX1M integration checks

on:
  push:
    branches: [integration/jx1m-clean-monorepo]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/INTEGRATION_AUDIT_VI.md
          test -f docs/SOURCE_AUDIT_2026-11-28_VI.md
          echo "Repository documentation checks passed."

      - name: Validate Cocos Creator assets
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and validate Cocos Main scene
        run: node tools/generate-cocos-main-scene.mjs

      - name: Check Cocos project manifest, imports, scene and maps
        run: node tools/validate-cocos-assets.mjs

      - name: Set up Go from server go.mod
        if: ${{ hashFiles('server/go.mod') != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Test Go server
        if: ${{ hashFiles('server/go.mod') != '' }}
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod download
          go test ./...
          go vet ./...
          go build -trimpath -o /tmp/jx1m-server-ci .

      - name: Smoke test Go API
        if: ${{ hashFiles('server/go.mod') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jx1m-ci-run/data
          (
            cd /tmp/jx1m-ci-run
            /tmp/jx1m-server-ci > /tmp/jx1m-ci-server.log 2>&1 &
            echo $! > /tmp/jx1m-ci-server.pid
          )
          cleanup() {
            if [ -f /tmp/jx1m-ci-server.pid ]; then
              kill "$(cat /tmp/jx1m-ci-server.pid)" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8083/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8083/health
          BASE_URL=http://127.0.0.1:8083 bash "$GITHUB_WORKSPACE/server/scripts/smoke-test.sh"

      - name: Report source not imported yet
        if: ${{ hashFiles('server/go.mod') == '' }}
        run: echo "::notice::Go source has not been imported yet; Go build, tests and API smoke test are not run."

  cocos-editor-validation:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cocos-editor-check]') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate deterministic Main scene
        shell: pwsh
        run: node tools/generate-cocos-main-scene.mjs

      - name: Download Cocos Creator 3.8.0 for Windows
        shell: pwsh
        run: |
          $url = 'https://download.cocos.com/CocosCreator/v3.8.0/CocosCreator-v3.8.0-win-072014.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'cocos-creator-3.8.0.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $install = Join-Path $env:RUNNER_TEMP 'cocos-creator-3.8.0'
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          Expand-Archive -Path $archive -DestinationPath $install -Force
          $creator = Get-ChildItem -Path $install -Filter 'CocosCreator.exe' -Recurse |
            Select-Object -First 1
          if (-not $creator) { throw 'CocosCreator.exe not found in official archive.' }
          "COCOS_CREATOR_EXE=$($creator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Web Mobile to verify Editor import and TypeScript compilation
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'client/cocos'
          $build = 'build/ci-web-mobile'
          & "$env:COCOS_CREATOR_EXE" --project "$project" --build "platform=web-mobile;debug=true;buildPath=$build;outputName=jx1m-ci-web-mobile;"
          $code = $LASTEXITCODE
          if ($code -notin @(0, 36)) {
            throw "Cocos Creator build failed with exit code $code"
          }
          $output = Join-Path $project $build
          if (-not (Test-Path $output)) {
            throw "Cocos build output directory was not created: $output"
          }
          $index = Get-ChildItem -Path $output -Filter 'index.html' -Recurse |
            Select-Object -First 1
          if (-not $index) {
            throw 'Cocos Web Mobile build did not produce index.html.'
          }
          "Cocos Web Mobile build verified: $($index.FullName)"

      - name: Upload Web Mobile preview build
        uses: actions/upload-artifact@v4
        with:
          name: jx1m-cocos-web-mobile-preview
          path: client/cocos/build/ci-web-mobile/
          if-no-files-found: error
          retention-days: 7
