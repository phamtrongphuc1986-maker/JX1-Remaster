name: Cocos Creator Windows editor validation

on:
  push:
    branches: [integration/jx1m-clean-monorepo]
    paths:
      - 'client/cocos/**'
      - 'tools/generate-cocos-main-scene.mjs'
      - '.github/workflows/cocos-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-web-mobile-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate deterministic Main scene
        shell: pwsh
        run: node tools/generate-cocos-main-scene.mjs

      - name: Download Cocos Creator 3.8.0 for Windows
        shell: pwsh
        run: |
          $url = 'https://download.cocos.com/CocosCreator/v3.8.0/CocosCreator-v3.8.0-win-072014.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'cocos-creator-3.8.0.zip'
          $install = Join-Path $env:RUNNER_TEMP 'cocos-creator-3.8.0'
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          Expand-Archive -Path $archive -DestinationPath $install -Force
          $creator = Get-ChildItem -Path $install -Filter 'CocosCreator.exe' -Recurse | Select-Object -First 1
          if (-not $creator) { throw 'CocosCreator.exe not found in official archive.' }
          if (-not (Test-Path -LiteralPath $creator.FullName -PathType Leaf)) { throw "Creator executable does not exist: $($creator.FullName)" }
          $file = Get-Item -LiteralPath $creator.FullName
          Write-Host "Creator executable: $($file.FullName)"
          Write-Host "Creator file size: $($file.Length)"
          Write-Host "Creator file version: $((Get-Item $creator.FullName).VersionInfo.FileVersion)"
          "COCOS_CREATOR_EXE=$($creator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Web Mobile with Cocos Creator 3.8.0 and capture diagnostics
        shell: pwsh
        env:
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_ENABLE_STACK_DUMPING: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE 'client/cocos'
          $buildRoot = Join-Path $project 'build'
          $diag = Join-Path $env:RUNNER_TEMP 'cocos-diagnostics'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $transcript = Join-Path $diag 'powershell-transcript.txt'
          Start-Transcript -Path $transcript -Force
          try {
            if (-not (Test-Path -LiteralPath $env:COCOS_CREATOR_EXE -PathType Leaf)) { throw "COCOS_CREATOR_EXE missing: $env:COCOS_CREATOR_EXE" }
            $exe = Get-Item -LiteralPath $env:COCOS_CREATOR_EXE
            Write-Host "Creator executable: $($exe.FullName); bytes=$($exe.Length); version=$($exe.VersionInfo.FileVersion)"
            Write-Host "Runner identity: $([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
            Write-Host "Explorer present: $([bool](Get-Process explorer -ErrorAction SilentlyContinue))"
            cmd /c 'query session' 2>&1 | Tee-Object -FilePath (Join-Path $diag 'session.txt')
            $appRoot = Split-Path -Parent $env:COCOS_CREATOR_EXE
            Get-ChildItem -LiteralPath $appRoot -Force | Select-Object Mode,Length,Name | Format-Table -AutoSize | Out-String | Write-Host
            $versionOut = Join-Path $diag 'creator-version.stdout.txt'
            $versionErr = Join-Path $diag 'creator-version.stderr.txt'
            $versionProc = Start-Process -FilePath $env:COCOS_CREATOR_EXE -ArgumentList @('--version') -WorkingDirectory $project -PassThru -Wait -RedirectStandardOutput $versionOut -RedirectStandardError $versionErr
            Write-Host "Creator --version exit code: $($versionProc.ExitCode)"
            if (Test-Path $versionOut) { Get-Content $versionOut -Raw | Write-Host }
            if (Test-Path $versionErr) { Get-Content $versionErr -Raw | Write-Host }
            if (Test-Path $buildRoot) { Remove-Item -LiteralPath $buildRoot -Recurse -Force }
            $stdout = Join-Path $diag 'creator-build.stdout.txt'
            $stderr = Join-Path $diag 'creator-build.stderr.txt'
            $builderLog = Join-Path $diag 'creator-builder.log'
            $args = @('--project', ('"' + $project + '"'), '--build', ('"platform=web-mobile;debug=true;buildPath=project://build;outputName=jx1m-ci-web-mobile;logDest=' + $builderLog + ';"'))
            Write-Host "Starting Cocos CLI with args: $($args -join ' ')"
            $started = Get-Date
            $proc = Start-Process -FilePath $env:COCOS_CREATOR_EXE -ArgumentList $args -WorkingDirectory $project -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $elapsed = (Get-Date) - $started
            Write-Host "Cocos Creator exit code: $($proc.ExitCode); elapsed seconds: $([math]::Round($elapsed.TotalSeconds,2))"
            foreach ($f in @($stdout,$stderr,$builderLog)) { if (Test-Path $f) { Write-Host "=== $f ==="; Get-Content $f -Tail 300 } else { Write-Host "Not created: $f" } }
            $eventStart = (Get-Date).AddMinutes(-15)
            foreach ($logName in @('Application','System')) {
              try {
                $events = Get-WinEvent -FilterHashtable @{LogName=$logName;StartTime=$eventStart;Level=1,2} -ErrorAction Stop | Where-Object { $_.Message -match 'CocosCreator|Electron|Faulting application|Application Error|Windows Error Reporting' } | Select-Object -First 30
                $events | ForEach-Object { "[$logName][$($_.TimeCreated)] $($_.ProviderName) EventId=$($_.Id)`n$($_.Message)`n" | Add-Content -Path (Join-Path $diag 'windows-crash-events.txt') }
              } catch { Write-Host "Could not query $logName event log: $_" }
            }
            $crashRoots = @((Join-Path $env:LOCALAPPDATA 'CrashDumps'),(Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\WER\ReportArchive'),(Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\WER\ReportQueue'))
            foreach ($root in $crashRoots) { if (Test-Path $root) { Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $started.AddMinutes(-1) } | Select-Object -First 30 FullName,Length,LastWriteTime | Format-Table -AutoSize | Out-String | Add-Content -Path (Join-Path $diag 'crash-files.txt') } }
            $creatorLogs = @((Join-Path $env:USERPROFILE '.CocosCreator'),(Join-Path $env:APPDATA 'CocosCreator'),(Join-Path $env:LOCALAPPDATA 'CocosCreator'))
            foreach ($root in $creatorLogs) { if (Test-Path $root) { Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $started.AddMinutes(-2) } | Sort-Object LastWriteTime -Descending | Select-Object -First 30 | ForEach-Object { $dest=Join-Path $diag ('creator-log-' + [guid]::NewGuid().ToString() + '-' + $_.Name); Copy-Item -LiteralPath $_.FullName -Destination $dest -Force -ErrorAction SilentlyContinue; Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -Tail 150 -ErrorAction SilentlyContinue } } }
            if ($proc.ExitCode -ne 36) { throw "Cocos Creator CLI failed with exit code $($proc.ExitCode). Review stdout, stderr, Builder log, and Windows crash events in artifact." }
            $output = Join-Path $buildRoot 'jx1m-ci-web-mobile'
            if (-not (Test-Path $output)) { throw "Build exit code 36 but output folder missing: $output" }
            $index = Get-ChildItem -Path $output -Filter 'index.html' -Recurse | Select-Object -First 1
            if (-not $index) { throw "Build exit code 36 but index.html missing under $output" }
            Write-Host "Verified Web Mobile output: $($index.FullName)"
          } finally { Stop-Transcript }
      - name: Upload Cocos diagnostics and editor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jx1m-cocos-startup-diagnostics
          path: ${{ runner.temp }}/cocos-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Web Mobile preview build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jx1m-cocos-web-mobile-preview
          path: client/cocos/build/jx1m-ci-web-mobile/
          if-no-files-found: error
          retention-days: 7
