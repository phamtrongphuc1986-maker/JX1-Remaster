name: Cocos Creator Windows editor validation

on:
  push:
    branches: [integration/jx1m-clean-monorepo]
    paths:
      - 'client/cocos/**'
      - 'tools/generate-cocos-main-scene.mjs'
      - '.github/workflows/cocos-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-web-mobile-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate deterministic Main scene
        shell: pwsh
        run: node tools/generate-cocos-main-scene.mjs

      - name: Download Cocos Creator 3.8.0 for Windows
        shell: pwsh
        run: |
          $url = 'https://download.cocos.com/CocosCreator/v3.8.0/CocosCreator-v3.8.0-win-072014.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'cocos-creator-3.8.0.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $install = Join-Path $env:RUNNER_TEMP 'cocos-creator-3.8.0'
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          Expand-Archive -Path $archive -DestinationPath $install -Force
          $creator = Get-ChildItem -Path $install -Filter 'CocosCreator.exe' -Recurse |
            Select-Object -First 1
          if (-not $creator) { throw 'CocosCreator.exe not found in official archive.' }
          "COCOS_CREATOR_EXE=$($creator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Web Mobile to verify scene import and TypeScript compilation
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'client/cocos'
          $buildRoot = Join-Path $project 'build'
          if (Test-Path $buildRoot) {
            Remove-Item -Path $buildRoot -Recurse -Force
          }
          # Pass buildPath as a native absolute path: the CLI string parser
          # rejects the 'project://' URL form used inside stored profiles
          # (Creator exits immediately with code 32 = invalid parameters).
          $arguments = "--project `"$project`" --build `"platform=web-mobile;debug=true;buildPath=$buildRoot;outputName=jx1m-ci-web-mobile;`" --disable-gpu"
          $process = Start-Process -FilePath $env:COCOS_CREATOR_EXE -ArgumentList $arguments -Wait -PassThru
          $code = $process.ExitCode
          "Cocos Creator process exit code: $code"
          # Cocos Creator 3.8 documents exit code 36 as successful build.
          if ($code -ne 36) {
            $logDir = Join-Path $project 'temp/builder/log'
            if (Test-Path $logDir) {
              Get-ChildItem $logDir -Recurse -File | ForEach-Object {
                Write-Host "---- $($_.FullName) ----"
                Get-Content $_.FullName -Tail 200
              }
            }
            # Surface the exit code and the key builder-log lines as check
            # annotations so the failure is readable without raw log access.
            function Escape-Wf([string]$s) {
              if ($s.Length -gt 400) { $s = $s.Substring(0, 400) }
              return $s -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            }
            Write-Host "::error title=CocosExitCode::Cocos Creator exited with code $code (expected 36 = success, 32 = invalid build parameters, 34 = build error)."
            $emitted = 0
            $candidates = @()
            if (Test-Path $logDir) {
              $candidates += Get-ChildItem $logDir -Recurse -File | Sort-Object LastWriteTime -Descending
            }
            $editorLogDir = Join-Path $env:APPDATA 'CocosCreator/logs'
            if (Test-Path $editorLogDir) {
              $candidates += Get-ChildItem $editorLogDir -File -Filter '*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 2
            }
            foreach ($file in $candidates) {
              if ($emitted -ge 35) { break }
              $hits = Select-String -Path $file.FullName -Pattern 'error|failed|exception' -SimpleMatch:$false |
                Select-Object -Last 12
              foreach ($hit in $hits) {
                if ($emitted -ge 35) { break }
                Write-Host "::error title=CocosBuildLog::$(Escape-Wf "$($file.Name): $($hit.Line.Trim())")"
                $emitted++
              }
            }
            if ($candidates.Count -gt 0) {
              $tail = Get-Content $candidates[0].FullName -Tail 8
              foreach ($line in $tail) {
                if ($emitted -ge 45) { break }
                if ($line.Trim().Length -gt 0) {
                  Write-Host "::error title=CocosBuildLogTail::$(Escape-Wf $line.Trim())"
                  $emitted++
                }
              }
            } else {
              Write-Host "::error title=CocosBuildLog::No builder log files were produced under temp/builder/log."
            }
            throw "Cocos Creator build failed with exit code $code (expected 36)."
          }
          if (-not (Test-Path $buildRoot)) {
            throw "Cocos Creator returned success but build root is missing: $buildRoot"
          }
          $index = Get-ChildItem -Path $buildRoot -Filter 'index.html' -Recurse |
            Select-Object -First 1
          if (-not $index) {
            throw "Cocos Creator reported success but no index.html exists under $buildRoot"
          }
          "Cocos Web Mobile build verified: $($index.FullName)"

      - name: Upload Cocos build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jx1m-cocos-editor-logs
          path: |
            client/cocos/temp/builder/log/
            client/cocos/temp/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Web Mobile preview build
        uses: actions/upload-artifact@v4
        with:
          name: jx1m-cocos-web-mobile-preview
          path: client/cocos/build/
          if-no-files-found: error
          retention-days: 7
